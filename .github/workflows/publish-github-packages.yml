name: Publish Maven Package to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Maven revision to publish
        required: true
        default: 1.3.0-SNAPSHOT

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 and Maven server credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          cache: maven

      - name: Publish to GitHub Packages
        run: >
          mvn -B
          -Pgithub-packages
          -DskipTests
          -Drevision=${{ inputs.revision }}
          -Dgithub.packages.owner=${{ github.repository_owner }}
          -Dgithub.packages.repo=${{ github.event.repository.name }}
          clean deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
